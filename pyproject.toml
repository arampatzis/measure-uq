[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[project]
authors = [
  {name = "G. Arampatzis", email = "georgios.arampatzis@uoc.gr"}
]
description = ""
dynamic = ["dependencies"]
name = "measure-uq"
readme = "README.md"
requires-python = ">=3.11,<4.0"
version = "0.1.0"

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
exclude = "(sandbox|docs)(/|\\|$)"
python_version = "3.12"

[[tool.mypy.overrides]]
disable_error_code = ["name-defined"]
ignore_missing_imports = true
module = [
  "chaospy",
  "corner",
  "emcee",
  "scipy.integrate",
  "numpoly",
  "sympy",
  "sympy.plotting",
  "torchvision"
]

[tool.numpydoc_validation]
checks = [
  "all",  # report on all checks, except the below
  "EX01",
  "SA01",
  "ES01"
]
exclude = [
  './sandbox/*.py$'
]
override_SS05 = [
  # override SS05 to allow docstrings starting with these words
  '^Process ',
  '^Assess ',
  '^Access '
]

[tool.poetry]
packages = [
  {include = "measure_uq"},
  {include = "examples"}
]

[tool.poetry.dependencies]
arviz = "^1.1.0"
chaospy = "^4.3.17"
clearml = "^1.16.4"
click = "^8.1.8"
corner = "^2.2"
emcee = "^3.1"
ipympl = "^0.10.0"
matplotlib = "^3.9.2"
numpy = ">=2"
python = "^3.12"
python-box = "^7.2.0"
seaborn = "^0.13.2"
sympy = ">=1.13.3"
torch = [
  {version = "^2.3", platform = "darwin"},
  {version = "^2.7.1", source = "pytorch", platform = "linux"}
]
wandb = "^0.18.3"

[tool.poetry.group.dev.dependencies]
bpython = "^0.24"
ipykernel = "^7.2.0"
jupyter = "^1.1.1"
mypy = "^1.11.2"
notebook = "^7.5.6"
pre-commit = "^4.0.0"
pretty-errors = "^1.2.25"
pydocstyle = "^6.3.0"
ruff = "^0.11.4"

[tool.poetry.group.doc.dependencies]
numpydoc = "^1.8.0"
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"

[[tool.poetry.source]]
name = "pytorch"
priority = "explicit"
url = "https://download.pytorch.org/whl/cu128"

[tool.pyright]
venv = ".venv"
# Use the Poetry in-project venv so Pylance/Pyright resolves third-party imports (e.g. chaospy).
venvPath = "."

[tool.ruff]
exclude = ["sandbox", "docs"]
ignore = [
  # pylint
  "PLR0913",
  "PLR0915",
  "PLR2004",
  # ruff
  "RUF001",
  # flake8-bandit
  "S101",
  "S102",
  "S602",
  "S603",
  "S604",
  # flake8-annotations
  "ANN",
  # flake8-commas
  "COM819",
  "COM812",
  #
  "NPY002",
  "B027",
  "PD901",
  "PD011",
  "PERF203",
  "A002",
  "A003",
  "PTH",
  "FBT",
  "DTZ",
  "EM",
  "FA100",
  "T201",
  "TRY003",
  "ISC001",
  "N806",
  "N803",
  "SLF001"
]
line-length = 88
select = ["ALL"]
target-version = "py310"

[tool.ruff.flake8-quotes]
inline-quotes = "double"

[tool.ruff.per-file-ignores]
"examples/equations/bistable_ode/plot.ipynb" = ["ERA001"]
"examples/equations/bistable_ode/plot_mytest.ipynb" = ["ERA001", "E402"]
"examples/equations/diffusion_1d/plot.ipynb" = ["ERA001"]
"examples/equations/reaction_diffusion_1d/plot_for_paper.ipynb" = ["ERA001", "D103", "RUF003", "E501"]
"examples/equations/wave_1d/plot.ipynb" = ["ERA001", "D103", "RUF003", "E501"]

[tool.ruff.pydocstyle]
convention = "numpy"
